  - op: sheets.spreadsheets.batchUpdate-unsupported
    action: deny
    reason: *unsupportedReason
    method: POST
    host: sheets.googleapis.com
    path: "/v4/spreadsheets/{fileId}:batchUpdate"
  # Sheet fields other than commentAnchors.
  - op: sheets.spreadsheets.create
    capability: files.create
    wildcardOnly: [parents]
    method: POST
    host: sheets.googleapis.com
    path: /v4/spreadsheets
    jsonAllowedKeys:
      "$": [properties, sheets, namedRanges, developerMetadata]
      "$.sheets[*]":
        - properties
        - data
        - merges
        - conditionalFormats
        - filterViews
        - protectedRanges
        - basicFilter
        - charts
        - bandedRanges
        - developerMetadata
        - rowGroups
        - columnGroups
        - slicers
        - tables
    count:
      - { counter: files.written }
  - op: sheets.spreadsheets.sheets.copyTo
    action: deny
    reason: a copy reads one file and writes another, past the files.read checks
    method: POST
    host: sheets.googleapis.com
    path: "/v4/spreadsheets/{fileId}/sheets/{sheetId}:copyTo"

  # Slides
  # Page object IDs may contain colons.
  - op: slides.presentations.get
    capability: files.read
    method: GET
    host: slides.googleapis.com
    path: /v1/presentations/{fileId}
    count:
      - { counter: files.read, key: fileId }
  - op: slides.presentations.pages.get
    capability: files.read
    method: GET
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}/pages/{pageObjectId:[A-Za-z0-9_:-]+}"
    count:
      - { counter: files.read, key: fileId }
  - op: slides.presentations.pages.getThumbnail
    capability: files.read
    method: GET
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}/pages/{pageObjectId:[A-Za-z0-9_:-]+}/thumbnail"
    count:
      - { counter: files.read, key: fileId }
  # Sheets charts copy or link the data of another spreadsheet. Videos embed
  # a Drive file or a YouTube video. The source has numeric aliases, so every
  # video is denied.
  - op: slides.presentations.batchUpdate-crossFile
    action: deny
    reason: Sheets charts and videos embed content of another file, past the files.read checks
    method: POST
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}:batchUpdate"
    jsonPresent: ["$..createSheetsChart", "$..replaceAllShapesWithSheetsChart", "$..refreshSheetsChart", "$..createVideo"]
  # Google fetches image URLs, background pictures included, at insertion.
  - op: slides.presentations.batchUpdate-fetch
    action: deny
    reason: images make Google fetch a URL the caller picks
    method: POST
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}:batchUpdate"
    jsonPresent: ["$..createImage", "$..replaceAllShapesWithImage", "$..replaceImage", "$..stretchedPictureFill"]
  - op: slides.presentations.batchUpdate-comments
    action: deny
    reason: *commentsReason
    method: POST
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}:batchUpdate"
    jsonPresent: ["$..insertComment", "$..addCommentReply", "$..updateCommentPost", "$..deleteComment", "$..deleteCommentReply"]
  # Every request kind except the ones denied above. Page backgrounds may
  # only be solid fills. Of the slide properties only isSkipped is writable,
  # so the notes page, which holds page elements, is left out.
  - op: slides.presentations.batchUpdate
    capability: files.edit
    method: POST
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}:batchUpdate"
    jsonAllowedKeys:
      "$": [requests, writeControl]
      "$.requests[*]":
        - createLine
        - createParagraphBullets
        - createShape
        - createSlide
        - createTable
        - deleteObject
        - deleteParagraphBullets
        - deleteTableColumn
        - deleteTableRow
        - deleteText
        - duplicateObject
        - groupObjects
        - insertTableColumns
        - insertTableRows
        - insertText
        - mergeTableCells
        - replaceAllText
        - rerouteLine
        - ungroupObjects
        - unmergeTableCells
        - updateImageProperties
        - updateLineCategory
        - updateLineProperties
        - updatePageElementAltText
        - updatePageElementTransform
        - updatePageElementsZOrder
        - updatePageProperties
        - updateParagraphStyle
        - updateShapeProperties
        - updateSlideProperties
        - updateSlidesPosition
        - updateTableBorderProperties
        - updateTableCellProperties
        - updateTableColumnProperties
        - updateTableRowProperties
        - updateTextStyle
        - updateVideoProperties
      "$.requests[*].updatePageProperties.pageProperties.pageBackgroundFill": [propertyState, solidFill]
      "$.requests[*].updateSlideProperties.slideProperties": [isSkipped]
    count:
      - { counter: files.written }
  - op: slides.presentations.batchUpdate-unsupported
    action: deny
    reason: *unsupportedReason
    method: POST
    host: slides.googleapis.com
    path: "/v1/presentations/{fileId}:batchUpdate"
  # Google ignores every field but the title and the presentation ID.
  - op: slides.presentations.create
    capability: files.create
    wildcardOnly: [parents]
    method: POST
    host: slides.googleapis.com
    path: /v1/presentations
    jsonAllowedKeys: { "$": [presentationId, title] }
    count:
      - { counter: files.written }

deny:
  contentType: "application/json; charset=UTF-8"
  # Google's error envelope, so gws prints the message and the reason
  # enclaveFilter. status is PERMISSION_DENIED, RESOURCE_EXHAUSTED for an
  # exhausted quota, or UNAVAILABLE when the token cannot be refreshed.
  body: '{"error":{"code":{{code}},"message":{{message}},"status":{{status}},"errors":[{"reason":"enclaveFilter","message":{{message}}}]}}'
