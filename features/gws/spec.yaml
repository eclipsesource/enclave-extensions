schemaVersion: "1"
kind: mixin
name: gws
displayName: Google Workspace CLI
description: >-
  Google Workspace CLI (gws) from a pinned release. Pair it with the gws
  request filter, which supplies the credential and the network policy.
defaultEnabled: false
priority: 60
failOnInstallError: true
# No credentials or network rules here. The gws filter sets
# GOOGLE_WORKSPACE_CLI_TOKEN to its placeholder, governs the Google API hosts,
# and confines googleapis.com. With that variable set, gws sends the token as
# is and never reads its own credential store.
environment:
  variables:
    # gws has no OS keyring on Linux and falls back to a key file. This makes
    # the fallback explicit for `gws auth` commands, which API calls never use.
    GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND: file
